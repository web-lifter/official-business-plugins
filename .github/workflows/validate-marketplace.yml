name: Validate marketplace
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: regression
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d regression" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgresql://postgres:test-only@localhost:5432/regression
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate packaging and generated metadata
        run: |
          python scripts/sync-openai.py --check
          python scripts/check-portability.py
          node scripts/check-versions.mjs
      - name: Run regression tests
        run: python -m pytest tests -q
      - name: Enforce increasing release versions
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-version-bumps.mjs
      - name: Install official Claude validator
        run: npm install --global @anthropic-ai/claude-code
      - name: Validate with the official Claude CLI
        run: node scripts/check-validate.mjs
