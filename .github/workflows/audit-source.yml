name: Audit source snapshot
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-source.yml'
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: audit-source
          path: source.zip
          retention-days: 1
