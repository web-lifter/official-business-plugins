name: Apply reviewed audit changes
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - '.audit/**'
      - '.github/workflows/apply-audit.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == 'web-lifter/official-business-plugins' && github.event.pull_request.head.ref == 'fix/chatgpt-marketplace-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: regression
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgresql://postgres:test-only@localhost:5432/regression
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and materialise reviewed changes
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path.cwd()
          encoded = ''.join((root / '.audit' / f'chunk-{i:02d}.txt').read_text() for i in range(11))
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          expected = 'c90a80c09ab5bf623bd0fc1b5ca19b7af61891f513e0e99f39f9743d7e07eeea'
          if hashlib.sha256(raw).hexdigest() != expected:
              raise SystemExit('Audit payload checksum mismatch')
          payload = json.loads(raw)
          baseline = '1d21e5847b9b0f5c3a8615bff5b44c13bcf55313'
          if payload['baseline'] != baseline or len(payload['changes']) != 415:
              raise SystemExit('Unexpected audit baseline or change count')
          subprocess.run(['git', 'merge-base', '--is-ancestor', baseline, 'HEAD'], check=True)
          seen = set()
          for change in payload['changes']:
              name = change['p']
              p = pathlib.PurePosixPath(name)
              if p.is_absolute() or '..' in p.parts or p.parts[0] in {'.git', '.github', '.audit'} or name in seen:
                  raise SystemExit(f'Unsafe or duplicate path: {name}')
              seen.add(name)
              target = root / p
              if target.is_symlink() or not target.resolve().is_relative_to(root):
                  raise SystemExit(f'Unsafe target: {name}')
              old = subprocess.run(['git', 'show', f'{baseline}:{name}'], capture_output=True)
              previous = old.stdout if old.returncode == 0 else b''
              current = target.read_bytes() if target.exists() else b''
              if current != previous:
                  raise SystemExit(f'Concurrent source change: {name}')
              if change.get('d'):
                  target.unlink()
                  continue
              lines = previous.decode('utf-8').splitlines(keepends=True)
              for start, end, replacement in reversed(change['e']):
                  if not 0 <= start <= end <= len(lines):
                      raise SystemExit(f'Invalid edit range: {name}')
                  lines[start:end] = [replacement]
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(''.join(lines).encode('utf-8'))
          print(f'Materialised {len(seen)} reviewed changes; checksum verified')
          PY
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate generated metadata and packaging
        run: |
          python scripts/sync-openai.py --check
          python scripts/check-portability.py
          node scripts/check-versions.mjs
          git diff --check
      - name: Run all regression tests
        run: python -m pytest tests -q --junitxml=/tmp/audit-tests.xml
      - name: Commit verified source to the review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github/workflows' ':!.audit'
          git commit -m 'fix: repair marketplace portability, runtime defects and Startups workflows'
          git push origin HEAD:refs/heads/fix/chatgpt-marketplace-audit
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-test-results
          path: /tmp/audit-tests.xml
          retention-days: 7
